name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m py_compile omo-model-slim omo_model_slim.py omo_tui.py opencode_manage.py
      - name: Unit and installer tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: python omo-model-slim --version

  website:
    name: Website build, types and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  installer:
    name: Installer smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate local checksum manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          names = ['omo-model-slim', 'omo_model_slim.py', 'omo_tui.py', 'opencode_manage.py', 'install.sh']
          Path('SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(Path(name).read_bytes()).hexdigest()}  {name}\n' for name in names
          ))
          PY
      - name: Install from local artifacts
        run: |
          OMO_BASE_URL="file://$PWD" PREFIX="$RUNNER_TEMP/omo-prefix" sh install.sh
          PREFIX="$RUNNER_TEMP/omo-prefix" sh install.sh verify
          "$RUNNER_TEMP/omo-prefix/bin/omo-model-slim" --version
      - name: Confirm original omo-model is untouched
        run: test ! -e "$RUNNER_TEMP/omo-prefix/bin/omo-model"

  wsl:
    name: WSL verification (manual)
    runs-on: ubuntu-latest
    steps:
      - name: WSL is not verifiable on GitHub-hosted runners
        run: echo "WSL 1/2 must be verified in a real Windows Subsystem for Linux environment; see README."
